<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>舞島 Dance Island</title>
  <meta name="description" content="台灣與世界街舞活動行事曆 — 像素 RPG 風格的街舞活動島">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23f07ca3' d='M1 0h2v1h2V0h2v1h1v3H7v1H6v1H5v1H3V6H2V5H1V4H0V1h1z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 開機畫面 -->
  <div id="boot">
    <div class="win">
      <div class="win-title yellow"><span class="t">dance_island.exe</span><div class="win-ctrls"><span>_</span><span>□</span><span>×</span></div></div>
      <div class="win-body">
        <div class="boot-logo"><div class="big">DANCE<br>ISLAND</div><div class="zh">舞 島</div></div>
        <div class="boot-dancer"></div>
        <div class="bar"></div>
        <div class="boot-status"><span>Loading…</span><b>0%</b></div>
        <button class="btn pink start hidden">▶ PRESS START</button>
      </div>
    </div>
  </div>

  <!-- 頂部 HUD -->
  <header id="hud" class="hidden">
    <a class="logo" href="#/"><span class="en">DANCE ISLAND</span><span class="zh">舞島</span></a>
    <nav class="crumbs" aria-label="目前位置"></nav>
    <span class="hud-spacer"></span>
    <div class="hud-btns">
      <button class="btn pink hud-add"><span class="ic"></span><span class="label"></span></button>
      <button class="btn teal hud-game"><span class="ic"></span><span class="label"></span></button>
      <button class="btn yellow hud-save"><span class="ic"></span><span class="label"></span></button>
      <button class="btn hud-player"></button>
      <button class="btn hud-lang">🌐 <span class="label"></span></button>
      <button class="btn icon hud-admin hidden"></button>
      <button class="btn icon hud-help">?</button>
      <button class="btn icon hud-sound"></button>
    </div>
  </header>

  <main id="stage"></main>
  <div id="wipe"></div>

  <script src="data/config.js"></script>
  <script src="data/geo.js"></script>
  <script src="data/events.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
