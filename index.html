  <script>
    // 自動更新：瀏覽器暫存了舊的頁面時，偷偷檢查一次有沒有新版，有就重新載入（每次開啟最多一次）
    (function () {
      var cur = (document.querySelector('script[src*="js/app.js"]') || {}).getAttribute ? document.querySelector('script[src*="js/app.js"]').getAttribute('src') : '';
      var key = 'danceIsland.reloadedFor';
      fetch('index.html?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
        var m = html.match(/js\/app\.js\?v=(\d+)/), now = (cur.match(/v=(\d+)/) || [])[1];
        if (m && now && m[1] !== now && sessionStorage.getItem(key) !== m[1]) { sessionStorage.setItem(key, m[1]); location.reload(); }
      }).catch(function () {});
    })();
  </script>
